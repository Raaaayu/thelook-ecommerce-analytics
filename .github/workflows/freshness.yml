# Ten plik umieść w repozytorium jako: .github/workflows/freshness.yml
name: Daily data freshness log

on:
  schedule:
    - cron: "17 5 * * *"   # codziennie o 05:17 UTC (07:17 w Warszawie latem, 06:17 zimą)
    - cron: "10 10 * * *"   # 10:10 UTC (12:10 w Warszawie latem) – drugie uruchomienie jako zabezpieczenie
  workflow_dispatch:         # przycisk "Run workflow" do ręcznego uruchomienia

jobs:
  freshness:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v6

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"   # ta sama wersja co lokalnie (sprawdź: python --version w aktywnym .venv)

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Zaloguj się do Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Zapisz świeżość danych do BigQuery
        run: python 03_freshness_log.py

name: Deploy BigQuery views

on:
  push:
    branches: [main]
    paths:                    # only when view definitions or the deploy script change
      - "sql/views/**"
      - "deploy_views.py"
  schedule:
    - cron: "30 4 * * 1"      # every Monday 04:30 UTC – renews views before the 60-day sandbox expiry
  workflow_dispatch:          # "Run workflow" button for a manual run

jobs:
  deploy-views:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v6

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Zaloguj się do Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Utwórz / odnów widoki w zbiorze marts
        run: python deploy_views.py
